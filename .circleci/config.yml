version: 2.1

executors:
  machine:
    machine:
      image: ubuntu-2404:current

jobs:
  build-and-test:
    executor: machine
    steps:
      - checkout
      - run:
          name: Lint shell scripts
          command: make lint
      - run:
          name: Run unit tests
          command: make test
      - run:
          name: Check guides links
          command: make test-docs
      - run:
          name: Build CLI bundle
          command: make bundle-cli
      - run:
          name: Build image and run smoke test
          command: make test-image
      - run:
          name: Run CLI end-to-end test
          command: make test-cli-e2e

  check-version-tag:
    executor: machine
    steps:
      - checkout
      - run:
          name: Check tag matches VERSION, README, guides and VAULT_VERSION lines
          command: make check-version-tag TAG="$CIRCLE_TAG"

  build-and-release:
    executor: machine
    steps:
      - checkout
      - run:
          name: Set up buildx and log in to Docker Hub
          command: make ci-release-setup
      - run:
          name: Build and push multi-arch image
          command: make release TAG="$CIRCLE_TAG"

  update-description:
    executor: machine
    steps:
      - checkout
      - run:
          name: Push Docker Hub description
          command: make update-description

  github-release:
    executor: machine
    steps:
      - checkout
      - run:
          name: Create GitHub release and upload CLI assets
          command: make github-release TAG="$CIRCLE_TAG"

workflows:
  build-and-test:
    jobs:
      - build-and-test

  release:
    jobs:
      - check-version-tag:
          filters: &release-filters
            tags:
              only: /^[0-9]+\.[0-9]+\.[0-9]+$/
            branches:
              ignore: /.*/
      - build-and-test:
          filters: *release-filters
      - build-and-release:
          context: docker-hub
          requires:
            - check-version-tag
            - build-and-test
          filters: *release-filters
      - update-description:
          context: docker-hub
          requires:
            - build-and-release
          filters: *release-filters
      - github-release:
          context: github
          requires:
            - build-and-release
          filters: *release-filters
